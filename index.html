<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miguel Castillo</title>


    <!-- MATERIAL ICONS CDN -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp" />

    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml" href="/images/logo3.svg">
    
    <!-- MONTSERRAT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    
    <!-- ICONSOUT CDN -->
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.6/css/unicons.css">
    
    <!-- STYLESHEET -->
    <link rel="stylesheet" href="./Css/style.css">
    <link rel="stylesheet" href="./Css/style-switcher.css">
    <link rel="stylesheet" href="./Css/color1.css" class="alternate-style" title="color-1">
    <link rel="stylesheet" href="./Css/color2.css" class="alternate-style" title="color-2" disabled>
    <link rel="stylesheet" href="./Css/color3.css" class="alternate-style" title="color-3" disabled>
    <link rel="stylesheet" href="./Css/color4.css" class="alternate-style" title="color-4" disabled>
    <link rel="stylesheet" href="./Css/color5.css" class="alternate-style" title="color-5" disabled>

    <!-- CDNJS TYPING -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"></script>
    <!-- 1. CARGAR LIBRERÍAS DE i18next PRIMERO -->
    <script src="https://unpkg.com/i18next@23.8.2/i18next.min.js"></script>
    <script src="https://unpkg.com/react-i18next@14.0.5/dist/umd/react-i18next.min.js"></script>
    <script src="https://unpkg.com/i18next-http-backend@2.4.2/i18nextHttpBackend.min.js"></script>

    <!-- 2. CONFIGURACIÓN DE i18n -->
    <script src="./JavaScript/i18n-config.js"></script>

        <!-- ARCHIVO DE TRADUCCIONES GLOBALES -->
    <script src="./JavaScript/translations.js"></script>



  
      
</head>

<body>

    <!-- CONTENEDORES PARA CADA SECCIÓN DE REACT -->
    <div id="navbar-root"></div>
    <div id="landing-root"></div>
    <div id="about-root"></div>
    <div id="services-root"></div>
    <div id="portfolio-root"></div>
    <div id="contacto-root"></div>
    


    <!--============ STYLE SWITCHER ======== -->
    <div class="style-switcher">
        <div class="style-switcher-toggler s-icon">
            <i class="uil uil-setting"></i>
        </div>
        <div class="day-night s-icon">
            <i class="uil"></i>
        </div>
        <!-- Añadimos un id para actualizar el texto dinámicamente para traducirlo-->
        <h4 id="switcher-theme-title">Color de tema</h4>
    
        <div class="colors">
            <span class="color-1" onclick="setActiveStyle('color-1')"></span>
            <span class="color-2" onclick="setActiveStyle('color-2')"></span>
            <span class="color-3" onclick="setActiveStyle('color-3')"></span>
            <span class="color-4" onclick="setActiveStyle('color-4')"></span>
            <span class="color-5" onclick="setActiveStyle('color-5')"></span>
        </div>
     <!-- Añadimos un id para actualizar el texto dinámicamente para traducirlo -->
        <h4 id="switcher-lang-title">Lenguaje</h4>

        <div class="lenguages">
            <div class="cont-checkbox">
                <input type="radio" name="myRadio" id="myRadio-1" />
                <label for="myRadio-1"><img class="translate en" src="./images/EU-flag.png" id="en" /></label>
            </div>
            <div class="cont-checkbox">
                <input type="radio" name="myRadio" id="myRadio-2" />
                <label for="myRadio-2"><img class="translate es" src="/images/Spain-flag.png" id="es" /></label>
            </div>
        </div>
    </div>
    <!--============ END OF STYLE SWITCHER ======== -->


    <!-- 1. CARGAR REACT Y REACT-DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- 2. CARGAR BABEL (Para interpretar JSX en el navegador) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>


    <!-- 3. IMPORTAR TUS COMPONENTES (Respetando el orden: Subcomponentes primero, luego componentes principales) -->
    <script type="text/babel" src="./Components/Navbar/Navbar.js"></script>
    <script type="text/babel" src="./Components/Landing/Landing.js"></script>
    <script type="text/babel" src="./Components/About/About.js"></script>
    <script type="text/babel" src="./Components/Services/ServiceCard.js"></script>
    <script type="text/babel" src="./Components/Services/Services.js"></script>
    <script type="text/babel" src="./Components/Portfolio/ProjectItem.js"></script>
    <script type="text/babel" src="./Components/Portfolio/Portfolio.js"></script>
    <script type="text/babel" src="./Components/Contact/Contact.js"></script>


    <!-- 4. SCRIPT DE RENDERIZADO MAESTRO -->
    <script type="text/babel">
        ReactDOM.createRoot(document.getElementById('navbar-root')).render(<Navbar />);
        ReactDOM.createRoot(document.getElementById('landing-root')).render(<Landing />);
        ReactDOM.createRoot(document.getElementById('about-root')).render(<About />);
        ReactDOM.createRoot(document.getElementById('services-root')).render(<Services />);
        ReactDOM.createRoot(document.getElementById('portfolio-root')).render(<Portfolio />);
        ReactDOM.createRoot(document.getElementById('contacto-root')).render(<Contact />);
    </script>


    <!--============ JS TRADICIONAL / AUXILIARES ======== -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="./JavaScript/style-switcher.js"></script>
    <script src="./JavaScript/translate.js"></script>

</body>

</html>
